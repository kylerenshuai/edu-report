<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>河南省中等职业教育学历认证报告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            line-height: 1.6;
        }
        /* 顶部导航栏模拟 */
        .top-bar {
            background: #fff;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            font-weight: 500;
            color: #000;
        }
        .top-bar .icon {
            color: #b71c1c;
            font-size: 24px;
            margin-right: 10px;
            font-weight: bold;
        }
        
        /* 主体内容区 */
        .container {
            padding: 20px 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 标题 */
        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #222;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        /* 照片 */
        .photo-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .photo-box img {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 信息列表 */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 16px;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
        }
        .info-label {
            width: 110px;
            color: #666;
            text-align: justify;
            text-align-last: justify; /* 让两字、四字标签两端对齐 */
            flex-shrink: 0;
            margin-right: 15px;
            padding-top: 2px;
        }
        .info-value {
            color: #222;
            flex: 1;
            word-break: break-all;
        }

        /* 底部信息 */
        .footer {
            background-color: #333;
            color: #999;
            text-align: center;
            padding: 20px 15px;
            font-size: 12px;
            margin-top: 40px;
            line-height: 1.8;
        }
        .footer p {
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <!-- 顶部 -->
    <div class="top-bar">
        <span class="icon">𰻞</span> 在线验证
    </div>

    <!-- 内容 -->
    <div class="container">
        <div class="title">河南省中等职业教育学历认证报告</div>

        <!-- 照片区域：请确保你的照片文件名为 photo.jpg，放在同一目录 -->
        <div class="photo-box">
            <img src="photo.jpg" alt="证件照" onerror="this.src='https://via.placeholder.com/120x160?text=请放入照片'">
        </div>

        <!-- 信息区域 -->
        <div class="info-list">
            <div class="info-row">
                <div class="info-label">姓名</div>
                <div class="info-value">底亚洲</div>
            </div>
            <div class="info-row">
                <div class="info-label">性别</div>
                <div class="info-value">男</div>
            </div>
            <div class="info-row">
                <div class="info-label">出生日期</div>
                <div class="info-value">1992年03月10日</div>
            </div>
            <div class="info-row">
                <div class="info-label">入学日期</div>
                <div class="info-value">2008年09月01日</div>
            </div>
            <div class="info-row">
                <div class="info-label">毕(结)业日期</div>
                <div class="info-value">2011年07月01日</div>
            </div>
            <div class="info-row">
                <div class="info-label">学校名称</div>
                <div class="info-value">民权县龙腾科技职业培训学校</div>
            </div>
            <div class="info-row">
                <div class="info-label">专业</div>
                <div class="info-value">电脑艺术设计</div>
            </div>
            <div class="info-row">
                <div class="info-label">学制</div>
                <div class="info-value">3 年</div>
            </div>
            <div class="info-row">
                <div class="info-label">学习形式</div>
                <div class="info-value">职业中专</div>
            </div>
            <div class="info-row">
                <div class="info-label">计划类别</div>
                <div class="info-value">全日制</div>
            </div>
            <div class="info-row">
                <div class="info-label">毕(结)业</div>
                <div class="info-value">毕业</div>
            </div>
            <div class="info-row">
                <div class="info-label">证书编号</div>
                <div class="info-value">42568698584</div>
            </div>
            <div class="info-row">
                <div class="info-label">报告编号</div>
                <div class="info-value">202600W0517</div>
            </div>
            <div class="info-row">
                <div class="info-label">打印日期</div>
                <div class="info-value">2026年09月24日</div>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        <p>主办单位：河南省中等职业教育学历认证网</p>
        <p>Copyright © 2014-2026 All Rights Reserved</p>
    </div>

</body>
</html>
